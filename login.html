<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClinicFlow</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>
    <div class="auth-container">

        <div class="auth-banner">
            <a href="index.html" class="logo">
                <img src="assets/images/logo.png" alt="ClinicFlow Logo" />
                <span>ClinicFlow</span>
            </a>

            <div class="auth-banner-content">
                <h1>Your smile<br>deserves the<br><span class="highlight">best care.</span></h1>
                <p>Sign in to book appointments, track your queue position in real time, and manage your dental health
                    history.</p>
            </div>
        </div>

        <div class="auth-form-container">
            <div class="auth-form-wrapper">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to access your dashboard</p>
                </div>

                <div class="auth-tabs">
                    <a href="login.html" class="auth-tab active">Sign In</a>
                    <a href="register.html" class="auth-tab">Register</a>
                </div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label>I AM A</label>
                        <div class="role-selector">
                            <label class="role-option">
                                <input type="radio" name="role" value="patient" checked>
                                <div class="role-label">
                                    <span class="role-icon">👱</span> Patient
                                </div>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="staff">
                                <div class="role-label">
                                    <span class="role-icon">👩‍⚕️</span> Staff / Admin
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="•••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>
            </div>
        </div>
    </div>
    <script src="assets/js/auth.js"></script>
</body>

</html>
