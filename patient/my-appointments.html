<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - ClinicFlow</title>
    <link rel="icon" type="image/png" href="../assets/images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/appointments.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="logo">
                    <img src="../assets/images/logo.png" alt="ClinicFlow Logo" />
                    <span>ClinicFlow</span>
                </a>
            </div>
            
            <div class="user-profile-section">
                <div class="avatar" id="sidebar-avatar">...</div>
                <div class="user-info">
                    <h3 class="user-name" id="sidebar-name">Loading...</h3>
                    <span class="user-role">Patient</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="book-appointment.html" class="nav-item">
                    <i data-lucide="book-open"></i>
                    <span>Book Appointment</span>
                </a>
                <a href="my-appointments.html" class="nav-item active">
                    <i data-lucide="calendar"></i>
                    <span>My Appointment</span>
                </a>
                <a href="queue-tracker.html" class="nav-item">
                    <i data-lucide="users"></i>
                    <span>Queue Tracker</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="../login.html" class="nav-item sign-out">
                    <i data-lucide="log-out"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header" style="margin-bottom: 2rem;">
                <h1 class="playfair" style="font-size: 2.2rem; margin-bottom: 0.25rem;">My Appointments</h1>
                <p style="color: var(--color-teal-700); font-weight: 500; font-size: 1.05rem;">View and manage all your appointments.</p>
            </header>

            <div class="appointments-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="upcoming">Upcoming</button>
                <button class="filter-btn" data-filter="past">Past</button>
            </div>

            <div class="appointments-container">
                <table class="appointments-table">
                    <thead>
                        <tr>
                            <th>SERVICE</th>
                            <th>DOCTOR</th>
                            <th>DATE & TIME</th>
                            <th>STATUS</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="appointments-tbody">
                        <!-- Populated via JS -->
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--light-text);">Loading appointments...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();
        
        // Check session and load user info
        fetch('../backend/check_session.php')
            .then(res => res.json())
            .then(data => {
                if(!data.success) {
                    window.location.href = '../login.html';
                } else {
                    document.getElementById('sidebar-name').textContent = data.user.name;
                    document.getElementById('sidebar-avatar').textContent = data.user.name.charAt(0).toUpperCase();
                }
            });
    </script>
    <script src="../assets/js/my-appointments.js"></script>
</body>
</html>
