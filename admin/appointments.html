<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Admin Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/staff.css">
    <link rel="stylesheet" href="../assets/css/admin.css">


    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body style="background-color: #f8f9fa;">
    <div class="dashboard-layout">

        <aside class="sidebar admin-sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="logo">
                    <img src="../assets/images/logo.png" alt="ClinicFlow Logo" />
                    <span>ClinicFlow</span>
                </a>
            </div>

            <div class="user-profile-section">
                <div class="avatar" id="sidebar-avatar"
                    style="background-color: white; color: black; font-weight: bold;">...</div>
                <div class="user-info">
                    <h3 class="user-name" id="sidebar-name">Loading...</h3>
                    <span class="user-role">Admin</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="users.html" class="nav-item">
                    <i data-lucide="users"></i>
                    <span>Users</span>
                </a>
                <a href="appointments.html" class="nav-item active">
                    <i data-lucide="clock"></i>
                    <span>Appointments</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="../login.html" id="logout-btn" class="nav-item sign-out">
                    <i data-lucide="log-out"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>


        <main class="main-content" style="padding: 3rem 4rem;">
            <header class="page-header" style="margin-bottom: 2rem;">
                <h1 class="playfair" style="font-size: 2.5rem; color: var(--color-dark); margin-bottom: 0.25rem;">
                    Appointments</h1>
                <p style="color: #666; font-weight: 500; font-size: 1.05rem;">Manage and update appointment status.</p>
            </header>

            <div class="appointments-toolbar">
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="search-input" placeholder="Search patient, doctor, service, date...">
                </div>

                <div class="filter-pills" id="filter-pills">
                    <button class="filter-pill active" data-filter="all">All</button>
                    <button class="filter-pill" data-filter="confirmed">Confirmed</button>
                    <button class="filter-pill" data-filter="pending">Pending</button>
                    <button class="filter-pill" data-filter="completed">Completed</button>
                    <button class="filter-pill" data-filter="cancelled">Cancelled</button>
                </div>
            </div>


            <div
                style="background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #eee;">
                <table class="history-table" style="margin: 0; width: 100%;">
                    <thead style="background: #f1f3f4; border-bottom: none;">
                        <tr>
                            <th style="padding: 1.2rem 1.5rem; color: #555; font-size: 0.85rem;">PATIENT</th>
                            <th style="padding: 1.2rem 1.5rem; color: #555; font-size: 0.85rem;">SERVICE</th>
                            <th style="padding: 1.2rem 1.5rem; color: #555; font-size: 0.85rem;">DOCTOR</th>
                            <th style="padding: 1.2rem 1.5rem; color: #555; font-size: 0.85rem;">DATE & TIME</th>
                            <th style="padding: 1.2rem 1.5rem; color: #555; font-size: 0.85rem;">STATUS</th>
                            <th style="padding: 1.2rem 1.5rem; color: #555; font-size: 0.85rem;">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="appointments-tbody">

                        <tr>
                            <td colspan="6" style="text-align: center; padding: 2rem;">Loading appointments...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();

        fetch('../backend/check_session.php')
            .then(res => res.json())
            .then(data => {
                if (!data.success || data.user.role !== 'admin') {
                    window.location.href = '../login.html';
                } else {
                    document.getElementById('sidebar-name').textContent = data.user.name;
                    document.getElementById('sidebar-avatar').textContent = data.user.name.charAt(0).toUpperCase();
                }
            });

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            fetch('../backend/logout.php')
                .finally(() => window.location.href = '../login.html');
        });

        let allAppointments = [];
        let currentFilter = 'all';

        function loadAppointments() {
            fetch('../backend/admin_get_appointments.php')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        allAppointments = data.appointments;
                        renderTable();
                    } else {
                        alert("Error: " + data.message);
                    }
                });
        }

        document.getElementById('search-input').addEventListener('input', renderTable);

        document.querySelectorAll('.filter-pill').forEach(pill => {
            pill.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderTable();
            });
        });

        function renderTable() {
            const tbody = document.getElementById('appointments-tbody');
            const search = document.getElementById('search-input').value.toLowerCase();
            tbody.innerHTML = '';

            const filtered = allAppointments.filter(app => {

                if (currentFilter !== 'all' && app.status.toLowerCase() !== currentFilter) {
                    return false;
                }

                const searchStr = `${app.patient_name} ${app.service} ${app.doctor_name} ${app.formatted_date}`.toLowerCase();
                if (!searchStr.includes(search)) {
                    return false;
                }

                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 2rem; color: #999;">No appointments found.</td></tr>';
                return;
            }

            filtered.forEach(app => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = "1px solid #eee";

                let statusClass = app.status.toLowerCase();
                let displayStatus = app.status.charAt(0).toUpperCase() + app.status.slice(1);

                let actionsHtml = '';
                if (statusClass === 'pending' || statusClass === 'rescheduling') {
                    actionsHtml = `
                        <button class="btn-action confirm" onclick="updateStatus(${app.id}, 'confirmed')"><i data-lucide="check-circle"></i> Confirm</button>
                        <button class="btn-action cancel" onclick="updateStatus(${app.id}, 'cancelled')"><i data-lucide="x-circle"></i> Cancel</button>
                        <button class="btn-action done" onclick="updateStatus(${app.id}, 'completed')"><i data-lucide="check-square"></i> Done</button>
                    `;
                } else if (statusClass === 'confirmed') {
                    actionsHtml = `
                        <button class="btn-action cancel" onclick="updateStatus(${app.id}, 'cancelled')"><i data-lucide="x-circle"></i> Cancel</button>
                        <button class="btn-action done" onclick="updateStatus(${app.id}, 'completed')"><i data-lucide="check-square"></i> Done</button>
                    `;
                } else if (statusClass === 'in_progress') {
                    displayStatus = 'In Progress';
                    actionsHtml = `
                        <button class="btn-action cancel" onclick="updateStatus(${app.id}, 'cancelled')"><i data-lucide="x-circle"></i> Cancel</button>
                        <button class="btn-action done" onclick="updateStatus(${app.id}, 'completed')"><i data-lucide="check-square"></i> Done</button>
                    `;
                } else {
                    actionsHtml = `<span style="color: #999; font-style: italic; font-size: 0.9rem;">No actions</span>`;
                }

                tr.innerHTML = `
                    <td style="padding: 1.5rem; font-weight: 600; color: #333;">${app.patient_name}</td>
                    <td style="padding: 1.5rem; color: #666;">${app.service}</td>
                    <td style="padding: 1.5rem; color: #666;">${app.doctor_name}</td>
                    <td style="padding: 1.5rem; color: #666;">${app.formatted_date} | ${app.formatted_time}</td>
                    <td style="padding: 1.5rem;">
                        <span class="status-pill ${statusClass}">${displayStatus}</span>
                    </td>
                    <td style="padding: 1.5rem;">
                        <div class="table-actions">${actionsHtml}</div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function updateStatus(id, newStatus) {
            fetch('../backend/admin_update_appointment.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ appointment_id: id, status: newStatus })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        loadAppointments(); // Refresh data
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Error connecting to server.");
                });
        }

        loadAppointments();
    </script>
</body>

</html>
