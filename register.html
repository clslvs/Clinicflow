<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ClinicFlow</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>
    <div class="auth-page">
        <!-- Decorative background elements -->
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>

        <div class="auth-card">
            <div class="auth-showcase">
                <a href="index.html" class="back-to-home">Back to Homepage &rarr;</a>
                <div class="slide slide-1 active"></div>
                <div class="slide slide-2"></div>
                <div class="slide slide-3"></div>
                
                <div class="showcase-content">
                    <h3 id="slide-title">Perfecting Smiles,<br>Restoring Confidence</h3>
                    <p id="slide-desc">Experience the best dental care in the city.</p>
                    <div class="slide-indicators">
                        <div class="indicator active" onclick="setSlide(0)"></div>
                        <div class="indicator" onclick="setSlide(1)"></div>
                        <div class="indicator" onclick="setSlide(2)"></div>
                    </div>
                </div>
            </div>

            <div class="auth-form-section">
                <div class="auth-header-new">
                    <a href="index.html" class="logo">
                        <img src="assets/images/logo.png" alt="ClinicFlow Logo" />
                        <span>ClinicFlow</span>
                    </a>
                    <h2>Create Account</h2>
                    <p>Join us at ClinicFlow</p>
                </div>

            <div class="auth-tabs">
                <a href="login.html" class="auth-tab">Sign In</a>
                <a href="register.html" class="auth-tab active">Register</a>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="Juan" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Dela Cruz" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="0912 345 6789" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="•••••••" required>
                </div>



                <button type="submit" class="btn btn-primary btn-glow">Create Account</button>
            </form>
            </div>
        </div>
    </div>
    <script src="assets/js/auth.js?v=5"></script>
</body>

</html>
