<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - Staff Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/staff.css">
    <link rel="stylesheet" href="../assets/css/settings.css">
    
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        
        <aside class="sidebar staff-sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo">
                    <img src="../assets/images/logo.png" alt="ClinicFlow Logo" />
                    <span>ClinicFlow</span>
                </a>
            </div>
            
            <div class="user-profile-section">
                <div class="avatar" id="sidebar-avatar">...</div>
                <div class="user-info">
                    <h3 class="user-name" id="sidebar-name">Loading...</h3>
                    <span class="user-role">Staff</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="queue.html" class="nav-item">
                    <i data-lucide="play"></i>
                    <span>Live Queue</span>
                </a>
                <a href="schedules.html" class="nav-item">
                    <i data-lucide="calendar"></i>
                    <span>Schedules</span>
                </a>
                <a href="records.html" class="nav-item">
                    <i data-lucide="users"></i>
                    <span>Patient Records</span>
                </a>
                <a href="settings.html" class="nav-item active">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="../login.html" id="logout-btn" class="nav-item">
                    <i data-lucide="log-out"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        
        <main class="main-content" style="padding: 3rem 4rem;">
            <header class="page-header" style="margin-bottom: 2.5rem;">
                <h1 class="playfair" style="font-size: 2.5rem; color: var(--color-dark); margin-bottom: 0.25rem;">Settings</h1>
                <p style="color: var(--color-teal-700); font-weight: 500; font-size: 1.05rem;">Manage your profile and preferences.</p>
            </header>

            <div class="settings-container">
                
                <div class="settings-card">
                    <div class="profile-header">
                        <div class="settings-avatar" id="settings-avatar">...</div>
                        <div class="settings-user-info">
                            <h3 id="settings-name">Loading...</h3>
                            <p id="settings-role-id">Role: Staff</p>
                        </div>
                    </div>
                    
                    <h4 class="settings-section-title">PERSONAL INFORMATION</h4>
                    
                    <form id="personal-form">
                        <div class="settings-grid">
                            <div class="input-group">
                                <label>FIRST NAME</label>
                                <input type="text" id="input-firstname" class="settings-input" readonly required>
                            </div>
                            <div class="input-group">
                                <label>MIDDLE NAME <span style="font-weight: 400; text-transform: none; color: var(--color-grey); font-size: 0.75rem;">(Optional)</span></label>
                                <input type="text" id="input-middlename" class="settings-input" readonly placeholder="None">
                            </div>
                            <div class="input-group">
                                <label>LAST NAME</label>
                                <input type="text" id="input-lastname" class="settings-input" readonly required>
                            </div>
                            <div class="input-group">
                                <label>SEX</label>
                                <select id="input-sex" class="settings-input" disabled>
                                    <option value="">Not specified</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>EMAIL</label>
                                <input type="email" id="input-email" class="settings-input" readonly required>
                            </div>
                            <div class="input-group">
                                <label>PHONE NUMBER</label>
                                <input type="tel" id="input-phone" class="settings-input" readonly maxlength="11" pattern="[0-9]{11}" inputmode="numeric" placeholder="09123456789" required>
                                <div class="phone-hint" id="personal-phone-hint" style="display: none;">
                                    <span>Exact 11 digits (e.g. 09123456789)</span>
                                    <span id="personal-phone-counter">0/11</span>
                                </div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button type="button" class="btn-settings-action" id="btn-edit-personal">Edit</button>
                            <button type="submit" class="btn-settings-action primary" id="btn-save-personal" style="display: none;">Save</button>
                        </div>
                    </form>
                </div>

                
                <div class="settings-card">
                    <h4 class="settings-section-title">PROFESSIONAL INFORMATION</h4>
                    <form id="professional-form">
                        <div class="input-group full-width">
                            <label>ACCOUNT ROLE</label>
                            <input type="text" id="input-role" class="settings-input" readonly value="Staff">
                        </div>
                        <div class="input-group full-width">
                            <label>ACCOUNT CREATED</label>
                            <input type="text" id="input-created" class="settings-input" readonly value="N/A">
                        </div>
                    </form>
                </div>

                
                <div class="settings-card">
                    <h4 class="settings-section-title">RESET PASSWORD</h4>
                    <form id="password-form">
                        <div class="input-group full-width">
                            <label>OLD PASSWORD</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="input-old-password" class="settings-input" required autocomplete="current-password">
                                <button type="button" class="toggle-password-btn" aria-label="Show password" title="Show password" tabindex="-1">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                        <line x1="2" y1="2" x2="22" y2="22"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="input-group full-width">
                            <label>NEW PASSWORD</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="input-new-password" class="settings-input" required autocomplete="new-password">
                                <button type="button" class="toggle-password-btn" aria-label="Show password" title="Show password" tabindex="-1">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                                        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                                        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                                        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                                        <line x1="2" y1="2" x2="22" y2="22"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button type="submit" class="btn-settings-action primary">Save</button>
                        </div>
                    </form>
                </div>

            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            fetch('../backend/logout.php')
                .finally(() => window.location.href = '../login.html');
        });

        const inputFirstName = document.getElementById('input-firstname');
        const inputMiddleName = document.getElementById('input-middlename');
        const inputLastName = document.getElementById('input-lastname');
        const inputSex = document.getElementById('input-sex');
        const inputEmail = document.getElementById('input-email');
        const inputPhone = document.getElementById('input-phone');
        const personalPhoneHint = document.getElementById('personal-phone-hint');
        const personalPhoneCounter = document.getElementById('personal-phone-counter');

        const btnEditPersonal = document.getElementById('btn-edit-personal');
        const btnSavePersonal = document.getElementById('btn-save-personal');
        const personalForm = document.getElementById('personal-form');

        function updatePhoneCounter(val) {
            if (!personalPhoneCounter) return;
            const len = (val || '').length;
            personalPhoneCounter.textContent = `${len}/11`;
            if (personalPhoneHint) {
                personalPhoneHint.classList.remove('valid', 'invalid');
                if (len === 11) {
                    personalPhoneHint.classList.add('valid');
                } else if (len > 0) {
                    personalPhoneHint.classList.add('invalid');
                }
            }
        }

        if (inputPhone) {
            inputPhone.addEventListener('input', () => {
                inputPhone.value = inputPhone.value.replace(/\D/g, '').slice(0, 11);
                updatePhoneCounter(inputPhone.value);
            });
        }

        fetch('../backend/get_user_settings.php')
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const user = data.user;

                    const initial = user.first_name ? user.first_name.charAt(0).toUpperCase() : 'S';
                    const middleInitial = user.middle_name ? ` ${user.middle_name.charAt(0)}.` : '';
                    const fullName = `${user.first_name || ''}${middleInitial} ${user.last_name || ''}`.trim() || user.name;

                    document.getElementById('sidebar-name').textContent = fullName;
                    document.getElementById('sidebar-avatar').textContent = initial;

                    document.getElementById('settings-name').textContent = fullName;
                    document.getElementById('settings-avatar').textContent = initial;

                    inputFirstName.value = user.first_name || '';
                    inputMiddleName.value = user.middle_name || '';
                    inputLastName.value = user.last_name || '';
                    if (inputSex) inputSex.value = user.sex || '';
                    inputEmail.value = user.email || '';
                    inputPhone.value = user.phone || '';
                    updatePhoneCounter(inputPhone.value);

                    document.getElementById('input-role').value = user.role.charAt(0).toUpperCase() + user.role.slice(1);
                    if(user.created_at) {
                        const dateObj = new Date(user.created_at);
                        document.getElementById('input-created').value = dateObj.toLocaleDateString('en-US', { month: 'long', day: '2-digit', year: 'numeric' });
                    }
                } else {
                    window.location.href = '../login.html';
                }
            })
            .catch(err => {
                console.error("Failed to fetch settings", err);
            });

        // Personal Information Edit / Save
        if (btnEditPersonal && personalForm) {
            btnEditPersonal.addEventListener('click', () => {
                inputFirstName.removeAttribute('readonly');
                inputMiddleName.removeAttribute('readonly');
                inputLastName.removeAttribute('readonly');
                inputEmail.removeAttribute('readonly');
                inputPhone.removeAttribute('readonly');
                if (inputSex) inputSex.removeAttribute('disabled');

                if (personalPhoneHint) personalPhoneHint.style.display = 'flex';
                updatePhoneCounter(inputPhone.value);

                btnEditPersonal.style.display = 'none';
                btnSavePersonal.style.display = 'inline-block';
                inputFirstName.focus();
            });

            personalForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const phoneVal = inputPhone.value.trim();
                if (phoneVal.length !== 11) {
                    alert("Phone number must be exactly 11 digits (e.g., 09123456789).");
                    inputPhone.focus();
                    return;
                }

                btnSavePersonal.disabled = true;
                btnSavePersonal.textContent = 'Saving...';

                const payload = {
                    first_name: inputFirstName.value.trim(),
                    middle_name: inputMiddleName.value.trim(),
                    last_name: inputLastName.value.trim(),
                    sex: inputSex ? inputSex.value : null,
                    email: inputEmail.value.trim(),
                    phone: phoneVal
                };

                fetch('../backend/update_personal_info.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    btnSavePersonal.disabled = false;
                    btnSavePersonal.textContent = 'Save';

                    if (data.success) {
                        inputFirstName.setAttribute('readonly', true);
                        inputMiddleName.setAttribute('readonly', true);
                        inputLastName.setAttribute('readonly', true);
                        inputEmail.setAttribute('readonly', true);
                        inputPhone.setAttribute('readonly', true);
                        if (inputSex) inputSex.setAttribute('disabled', true);

                        if (personalPhoneHint) personalPhoneHint.style.display = 'none';
                        btnSavePersonal.style.display = 'none';
                        btnEditPersonal.style.display = 'inline-block';

                        const initial = payload.first_name.charAt(0).toUpperCase();
                        const middleInitial = payload.middle_name ? ` ${payload.middle_name.charAt(0)}.` : '';
                        const fullName = `${payload.first_name}${middleInitial} ${payload.last_name}`.trim();

                        document.getElementById('sidebar-avatar').textContent = initial;
                        document.getElementById('sidebar-name').textContent = fullName;
                        document.getElementById('settings-avatar').textContent = initial;
                        document.getElementById('settings-name').textContent = fullName;

                        alert("Personal information updated successfully.");
                    } else {
                        alert(data.message || "Failed to update personal information.");
                    }
                })
                .catch(err => {
                    console.error("Error updating personal info:", err);
                    btnSavePersonal.disabled = false;
                    btnSavePersonal.textContent = 'Save';
                    alert("Error connecting to server.");
                });
            });
        }

        // Password Reset
        document.getElementById('password-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = 'Saving...';
            btn.disabled = true;

            const oldPassword = document.getElementById('input-old-password').value;
            const newPassword = document.getElementById('input-new-password').value;

            if (newPassword.length < 6) {
                alert("New password must be at least 6 characters long.");
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }

            fetch('../backend/update_password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    old_password: oldPassword,
                    new_password: newPassword
                })
            })
            .then(res => res.json())
            .then(data => {
                btn.textContent = originalText;
                btn.disabled = false;
                
                if (data.success) {
                    alert('Password updated successfully!');
                    this.reset();
                } else {
                    alert(data.message || 'Failed to update password');
                }
            })
            .catch(err => {
                btn.textContent = originalText;
                btn.disabled = false;
                alert('An error occurred while updating the password');
                console.error(err);
            });
        });

        // Password Visibility Toggle (Show / Hide password)
        document.querySelectorAll('.toggle-password-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const wrapper = btn.closest('.password-input-wrapper');
                if (!wrapper) return;
                const input = wrapper.querySelector('input');
                if (!input) return;

                const eyeIcon = btn.querySelector('.eye-icon');
                const eyeOffIcon = btn.querySelector('.eye-off-icon');
                const isPassword = input.type === 'password';

                input.type = isPassword ? 'text' : 'password';

                if (eyeIcon && eyeOffIcon) {
                    eyeIcon.style.display = isPassword ? 'none' : 'block';
                    eyeOffIcon.style.display = isPassword ? 'block' : 'none';
                }

                const labelText = isPassword ? 'Hide password' : 'Show password';
                btn.setAttribute('aria-label', labelText);
                btn.setAttribute('title', labelText);
            });
        });
    </script>
</body>
</html>
