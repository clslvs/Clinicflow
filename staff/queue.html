<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - Live Queue</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/staff.css">
    
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        
        <aside class="sidebar staff-sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo">
                    <img src="../assets/images/logo.png" alt="ClinicFlow Logo" />
                    <span>ClinicFlow</span>
                </a>
            </div>
            
            <div class="user-profile-section">
                <div class="avatar" id="sidebar-avatar">...</div>
                <div class="user-info">
                    <h3 class="user-name" id="sidebar-name">Loading...</h3>
                    <span class="user-role">Staff</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="queue.html" class="nav-item active">
                    <i data-lucide="play"></i>
                    <span>Live Queue</span>
                </a>
                <a href="schedules.html" class="nav-item">
                    <i data-lucide="calendar"></i>
                    <span>Schedules</span>
                </a>
                <a href="records.html" class="nav-item">
                    <i data-lucide="users"></i>
                    <span>Patient Records</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="../login.html" id="logout-btn" class="nav-item">
                    <i data-lucide="log-out"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        
        <main class="main-content" style="padding: 3rem 4rem;">
            <header class="page-header" style="margin-bottom: 2.5rem;">
                <h1 class="playfair" style="font-size: 2.5rem; color: var(--color-dark); margin-bottom: 0.25rem;">Live Queue Control</h1>
                <p style="color: var(--color-teal-700); font-weight: 500; font-size: 1.05rem;">Manage patient flow in real time.</p>
            </header>

            <div class="queue-metrics-container">
                <div class="queue-metric-card">
                    <div class="queue-metric-number text-yellow" id="metric-in-progress">00</div>
                    <div class="queue-metric-label">In Progress</div>
                </div>
                <div class="queue-metric-card">
                    <div class="queue-metric-number text-teal" id="metric-waiting">00</div>
                    <div class="queue-metric-label">Waiting</div>
                </div>
                <div class="queue-metric-card">
                    <div class="queue-metric-number text-grey" id="metric-completed">00</div>
                    <div class="queue-metric-label">Completed</div>
                </div>
            </div>

            <div class="queue-list-card">
                <div class="queue-list-header">
                    QUEUE TODAY
                </div>
                <div id="queue-list-container">
                    <div style="padding: 3rem; text-align: center; color: var(--color-grey);">Loading queue...</div>
                </div>
            </div>

        </main>
    </div>

    
    <div id="completion-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 2rem; border-radius: 12px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
            <h2 class="playfair" style="margin-bottom: 1.5rem; color: var(--color-dark);">Complete Appointment</h2>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label style="display:block; margin-bottom: 0.5rem; font-weight:600; color:var(--color-grey); font-size: 0.85rem;">NOTES FOR PATIENT (OPTIONAL)</label>
                <textarea id="modal-notes" rows="3" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--color-teal-100); font-family: inherit; resize: vertical;"></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="display:block; margin-bottom: 0.5rem; font-weight:600; color:var(--color-grey); font-size: 0.85rem;">RECOMMENDED FOLLOW-UP DATE (OPTIONAL)</label>
                <input type="date" id="modal-followup-date" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--color-teal-100);">
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button type="button" class="btn-outline-teal" onclick="closeCompletionModal()">Cancel</button>
                <button type="button" class="btn-solid-teal" id="btn-confirm-complete">Mark Done</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            fetch('../backend/logout.php')
                .finally(() => window.location.href = '../login.html');
        });

        fetch('../backend/check_session.php')
            .then(res => res.json())
            .then(data => {
                if(!data.success || (data.user.role !== 'staff' && data.user.role !== 'admin')) {
                    window.location.href = '../login.html';
                } else {
                    const name = data.user.name;
                    document.getElementById('sidebar-name').textContent = name;
                    document.getElementById('sidebar-avatar').textContent = name.charAt(0);
                }
            });

        function loadQueue() {
            fetch('../backend/staff_get_queue.php')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('metric-in-progress').textContent = data.metrics.in_progress;
                        document.getElementById('metric-waiting').textContent = data.metrics.waiting;
                        document.getElementById('metric-completed').textContent = data.metrics.completed;

                        renderQueue(data.queue);
                    }
                });
        }

        function renderQueue(queueItems) {
            const container = document.getElementById('queue-list-container');
            container.innerHTML = '';

            if (queueItems.length === 0) {
                container.innerHTML = '<div style="padding: 3rem; text-align: center; color: var(--color-grey);">No appointments scheduled for today.</div>';
                return;
            }

            queueItems.forEach(item => {
                const el = document.createElement('div');
                el.className = 'queue-item';

                let circleClass = '';
                let circleContent = item.queue_no;
                let statusPill = '';
                let actionsHtml = '';

                if (item.status === 'completed') {
                    circleClass = 'bg-grey';
                    circleContent = '<i data-lucide="check" style="width: 24px; height: 24px;"></i>';
                    statusPill = '<div class="status-pill status-completed">Completed</div>';
                    actionsHtml = '<button class="btn-q-action btn-q-disabled" disabled>Done</button>';
                } else if (item.status === 'in_progress') {
                    circleClass = 'bg-yellow';
                    statusPill = '<div class="status-pill status-in-progress">In Progress</div>';
                    actionsHtml = `<button class="btn-q-action btn-q-solid-green" onclick="openCompletionModal(${item.id})">Mark Done</button>`;
                } else if (item.status === 'waiting') {
                    circleClass = 'bg-light-teal';
                    statusPill = '<div class="status-pill status-waiting">Waiting</div>';
                    actionsHtml = `
                        <button class="btn-q-action btn-q-solid-teal" onclick="updateStatus(${item.id}, 'in_progress')">Call</button>
                        <button class="btn-q-action btn-q-outline-red" onclick="updateStatus(${item.id}, 'cancelled')">Cancel</button>
                    `;
                }

                let priorityBadge = item.is_priority ? '<span class="status-pill bg-yellow" style="color:var(--color-dark); margin-left:10px; padding: 2px 8px; font-size: 0.75rem;">PWD/Senior</span>' : '';

                el.innerHTML = `
                    <div class="queue-num-circle ${circleClass}">
                        ${circleContent}
                    </div>
                    <div class="queue-details">
                        <h4>${item.patient_name} | Queue No. ${item.queue_no} ${priorityBadge}</h4>
                        <p>${item.service} - ${item.doctor_name} | ${item.room_no}</p>
                    </div>
                    <div class="queue-status-col">
                        ${statusPill}
                    </div>
                    <div class="queue-actions-col">
                        ${actionsHtml}
                    </div>
                `;
                container.appendChild(el);
            });
            lucide.createIcons();
        }

        function updateStatus(appointmentId, newStatus, extraData = {}) {
            const payload = { appointment_id: appointmentId, status: newStatus, ...extraData };
            
            fetch('../backend/staff_update_queue_status.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    loadQueue(); // refresh queue
                } else {
                    alert(data.message);
                }
            });
        }
        
        let pendingCompletionId = null;
        
        function openCompletionModal(appointmentId) {
            pendingCompletionId = appointmentId;
            document.getElementById('modal-notes').value = '';
            document.getElementById('modal-followup-date').value = '';
            document.getElementById('completion-modal').style.display = 'flex';
        }
        
        function closeCompletionModal() {
            document.getElementById('completion-modal').style.display = 'none';
            pendingCompletionId = null;
        }
        
        document.getElementById('btn-confirm-complete').addEventListener('click', () => {
            if (pendingCompletionId) {
                const notes = document.getElementById('modal-notes').value;
                const followupDate = document.getElementById('modal-followup-date').value;
                updateStatus(pendingCompletionId, 'completed', { notes: notes, follow_up_date: followupDate });
                closeCompletionModal();
            }
        });

        loadQueue();

        setInterval(loadQueue, 15000);

    </script>
</body>
</html>
