<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow - Schedules</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/variables.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/staff.css">
    
    
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        
        <aside class="sidebar staff-sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="logo">
                    <img src="../assets/images/logo.png" alt="ClinicFlow Logo" />
                    <span>ClinicFlow</span>
                </a>
            </div>
            
            <div class="user-profile-section">
                <div class="avatar" id="sidebar-avatar">...</div>
                <div class="user-info">
                    <h3 class="user-name" id="sidebar-name">Loading...</h3>
                    <span class="user-role">Staff</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>
                <a href="queue.html" class="nav-item">
                    <i data-lucide="play"></i>
                    <span>Live Queue</span>
                </a>
                <a href="schedules.html" class="nav-item active">
                    <i data-lucide="calendar"></i>
                    <span>Schedules</span>
                </a>
                <a href="records.html" class="nav-item">
                    <i data-lucide="users"></i>
                    <span>Patient Records</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="../login.html" id="logout-btn" class="nav-item">
                    <i data-lucide="log-out"></i>
                    <span>Sign Out</span>
                </a>
            </div>
        </aside>

        
        <main class="main-content" style="padding: 3rem 4rem;">
            <header class="page-header" style="margin-bottom: 2.5rem;">
                <h1 class="playfair" style="font-size: 2.5rem; color: var(--color-dark); margin-bottom: 0.25rem;">Doctor Schedules</h1>
                <p style="color: var(--color-teal-700); font-weight: 500; font-size: 1.05rem;">View weekly schedules for each doctor.</p>
            </header>

            <div class="doctor-cards-container" id="doctors-container">
                <div style="color: var(--color-grey);">Loading doctors...</div>
            </div>

            <div class="calendar-container">
                <div class="calendar-header">
                    <h3 id="calendar-title">Loading...</h3>
                    <div class="calendar-nav">
                        <button class="btn-cal-nav" id="btn-prev-week"><i data-lucide="chevron-left"></i></button>
                        <button class="btn-cal-nav" id="btn-next-week"><i data-lucide="chevron-right"></i></button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    
                </div>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            fetch('../backend/logout.php')
                .finally(() => window.location.href = '../login.html');
        });

        fetch('../backend/check_session.php')
            .then(res => res.json())
            .then(data => {
                if(!data.success || (data.user.role !== 'staff' && data.user.role !== 'admin')) {
                    window.location.href = '../login.html';
                } else {
                    const name = data.user.name;
                    document.getElementById('sidebar-name').textContent = name;
                    document.getElementById('sidebar-avatar').textContent = name.charAt(0);
                }
            });

        let currentDoctorId = null;
        let currentDoctorName = "";
        let currentWeekStart = new Date();

        const dayOfWeek = currentWeekStart.getDay();
        const diffToMonday = currentWeekStart.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1); // adjust when day is sunday
        currentWeekStart.setDate(diffToMonday);
        currentWeekStart.setHours(0,0,0,0);

        function formatDateToYMD(date) {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();

            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;

            return [year, month, day].join('-');
        }

        const colors = ['green', 'yellow', 'purple'];

        fetch('../backend/staff_get_doctors.php')
            .then(res => res.json())
            .then(data => {
                if (data.success && data.doctors.length > 0) {
                    const container = document.getElementById('doctors-container');
                    container.innerHTML = '';
                    
                    data.doctors.forEach((doc, index) => {
                        const el = document.createElement('div');
                        el.className = 'doc-card';
                        el.dataset.id = doc.id;
                        
                        const colorClass = colors[index % colors.length];
                        const initial = doc.name.replace('Dr. ', '').charAt(0).toUpperCase();

                        el.innerHTML = `
                            <div class="doc-avatar ${colorClass}">${initial}</div>
                            <div class="doc-info">
                                <h4>${doc.name}</h4>
                                <p>${doc.specialty}</p>
                            </div>
                        `;

                        el.onclick = () => {
                            document.querySelectorAll('.doc-card').forEach(c => c.classList.remove('active'));
                            el.classList.add('active');
                            currentDoctorId = doc.id;
                            currentDoctorName = doc.name;
                            renderCalendar();
                        };

                        container.appendChild(el);

                        if (index === 0) el.click();
                    });
                }
            });

        document.getElementById('btn-prev-week').addEventListener('click', () => {
            currentWeekStart.setDate(currentWeekStart.getDate() - 7);
            renderCalendar();
        });

        document.getElementById('btn-next-week').addEventListener('click', () => {
            currentWeekStart.setDate(currentWeekStart.getDate() + 7);
            renderCalendar();
        });

        function renderCalendar() {
            if (!currentDoctorId) return;

            const weekEnd = new Date(currentWeekStart);
            weekEnd.setDate(currentWeekStart.getDate() + 5); // Saturday

            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const m1 = monthNames[currentWeekStart.getMonth()];
            const d1 = currentWeekStart.getDate();
            const m2 = monthNames[weekEnd.getMonth()];
            const d2 = weekEnd.getDate();
            const year = currentWeekStart.getFullYear();
            
            let dateStr = `${m1} ${d1}-${d2}`;
            if (m1 !== m2) dateStr = `${m1} ${d1}-${m2} ${d2}`;

            document.getElementById('calendar-title').textContent = `${currentDoctorName} - Week of ${dateStr}, ${year}`;

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const dayNames = ['MON', 'TUES', 'WED', 'THURS', 'FRI', 'SAT'];
            const dayColumns = []; // Store elements to append appointments later

            for (let i = 0; i < 6; i++) {
                const currentDate = new Date(currentWeekStart);
                currentDate.setDate(currentWeekStart.getDate() + i);
                
                const ymd = formatDateToYMD(currentDate);

                const col = document.createElement('div');
                col.className = 'calendar-day-col';
                col.dataset.date = ymd;

                const header = document.createElement('div');
                header.className = 'calendar-day-header';
                header.innerHTML = `
                    <div class="day-name">${dayNames[i]}</div>
                    <div class="day-date">${monthNames[currentDate.getMonth()]} ${currentDate.getDate().toString().padStart(2, '0')}</div>
                `;

                const body = document.createElement('div');
                body.className = 'calendar-day-body';
                body.id = 'col-' + ymd;

                col.appendChild(header);
                col.appendChild(body);
                grid.appendChild(col);
                dayColumns.push(body);
            }

            const startStr = formatDateToYMD(currentWeekStart);
            const endStr = formatDateToYMD(weekEnd);

            fetch(`../backend/staff_get_weekly_schedule.php?doctor_id=${currentDoctorId}&start_date=${startStr}&end_date=${endStr}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        data.schedule.forEach(appt => {
                            const colBody = document.getElementById('col-' + appt.date);
                            if (colBody) {

                                let timeStr = 'Time not set';
                                if (appt.time) {
                                    const timeParts = appt.time.split(':');
                                    const d = new Date();
                                    d.setHours(timeParts[0], timeParts[1] || 0);
                                    timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                                }

                                const block = document.createElement('div');
                                block.className = 'appt-block';
                                block.innerHTML = `
                                    <div class="appt-patient">${appt.patient_name}</div>
                                    <div class="appt-issue">${appt.service}</div>
                                    <div class="appt-time">${timeStr}</div>
                                `;
                                colBody.appendChild(block);
                            }
                        });
                    }
                });
        }
    </script>
</body>
</html>
